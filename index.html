<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Mock Interviews | Team Visionaries</title>
<link rel="icon" id="fav" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0f1c;--mut:#5b6577;--line:#e1e6ef;--paper:#f4f7fc;--acc:#1f6bff;--acc2:#1450d6;--cy:#19c3ff;--warn:#b45309}
*{box-sizing:border-box;margin:0}
body{font-family:'Manrope','Noto Sans Devanagari',sans-serif;color:var(--ink);background:var(--paper);line-height:1.55;min-height:100vh}
h1,h2,h3{font-weight:800;letter-spacing:-.01em}
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 5vw;background:#000;color:#fff;border-bottom:1px solid #1b2333}
.logo{display:flex;align-items:center;gap:12px;cursor:pointer;font-size:18px;font-weight:800}
.logo img{height:40px;width:auto;display:block}
select,input,textarea{font:inherit;color:var(--ink);padding:11px 14px;border:1px solid #cdd5e3;border-radius:8px;background:#fff;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
select:focus,input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(31,107,255,.18)}
#lang{width:auto;font-weight:600;padding:8px 12px;background:#0b1220;color:#fff;border-color:#2a3550}
main{max-width:1040px;margin:0 auto;padding:28px 5vw 50px}
.screen{display:none}.screen.on{display:block;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
@keyframes blink{50%{opacity:.25}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(220,60,50,.45)}100%{box-shadow:0 0 0 14px rgba(220,60,50,0)}}
.hero{background:radial-gradient(ellipse at 85% 45%,rgba(31,107,255,.35),transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(25,195,255,.12),transparent 50%),#000;color:#fff;border-radius:16px;padding:56px clamp(24px,5vw,56px);display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center}
.hero h1{font-size:clamp(32px,4.6vw,52px);line-height:1.1;color:#fff;letter-spacing:-.025em}
.hero p{font-size:18px;max-width:560px;margin:18px 0 28px;color:#c5d0e4}
.hlogo{width:100%;max-width:380px;justify-self:center;mix-blend-mode:lighten}
.btn{border:0;cursor:pointer;font:700 15px 'Manrope','Noto Sans Devanagari',sans-serif;color:#fff;padding:12px 24px;border-radius:8px;background:var(--acc);transition:background .15s}
.btn:hover{background:var(--acc2)}.btn.sec{background:#fff;color:var(--ink);border:1px solid #cdd5e3}.btn.sec:hover{background:#eef2f9}.btn.red{background:#b42318}.btn.red:hover{background:#912018}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:32px}
.chip{border:1px solid rgba(255,255,255,.22);color:#dbe5f7;padding:5px 14px;border-radius:999px;font-weight:600;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px;box-shadow:0 1px 2px rgba(10,15,28,.04)}
.feat{border-top:3px solid var(--acc)}.feat h3{font-size:17px;margin-bottom:6px}.feat p{color:var(--mut);font-size:15px}
.form{display:grid;gap:16px;max-width:640px;margin:0 auto}.form label{font-weight:700;display:grid;gap:6px;font-size:14px}.form b{font-size:14px}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1;padding:10px;border-radius:8px;border:1px solid #cdd5e3;background:#fff;font:600 14px 'Manrope','Noto Sans Devanagari',sans-serif;color:var(--ink);cursor:pointer}
.seg button.on{background:#000;color:#fff;border-color:#000}
.panel{display:flex;justify-content:center;gap:36px;margin:6px 0 16px;flex-wrap:wrap}
.av{text-align:center;opacity:.55;transition:opacity .2s}.av.on{opacity:1}
.face{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:800;color:#fff;margin:0 auto 6px;background:#000;transition:box-shadow .2s}
.av.r .face{background:var(--acc)}.av.on .face{box-shadow:0 0 0 4px rgba(31,107,255,.28)}
.av small{display:block;color:var(--mut);font-size:12px}
#chat{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--paper);border-radius:10px}
.msg{max-width:82%;padding:11px 15px;border-radius:12px;animation:pop .25s;line-height:1.5}
.msg b{display:block;font-size:12px;opacity:.7;margin-bottom:2px}
.msg.ai{background:#fff;border:1px solid var(--line);align-self:flex-start}.msg.me{background:var(--acc);color:#fff;align-self:flex-end}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mut);animation:blink 1s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
.bar{display:flex;gap:10px;align-items:center;margin-top:14px}
.mic{flex:none;width:50px;height:50px;border-radius:50%;border:0;cursor:pointer;background:var(--acc);color:#fff;display:grid;place-items:center}.mic:hover{background:var(--acc2)}.mic.live{background:#d92d20;animation:ring 1.2s infinite}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tag{background:var(--paper);padding:5px 12px;border-radius:6px;font-weight:700;font-size:13px;border:1px solid var(--line)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin:20px 0}
.ring{--v:0;width:104px;height:104px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:conic-gradient(var(--c,var(--acc)) calc(var(--v)*1%),#e3e8f1 0);transition:background 1s}
.ring i{width:80px;height:80px;border-radius:50%;background:#fff;display:grid;place-items:center;font:800 24px 'Manrope',sans-serif;font-style:normal}
.score{text-align:center;font-weight:600;color:var(--mut);font-size:14px}
.rep h2{margin:26px 0 10px;font-size:20px}.rep ul{padding-left:20px;display:grid;gap:6px}
.mis{background:#fff;border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:14px 16px;margin-bottom:12px}.mis p{margin-top:4px}.mis .good{background:#eaf2ff;border-radius:6px;padding:9px 12px;margin-top:10px}
footer{background:#000;color:#aab6cc;text-align:center;padding:30px 5vw;font-size:14px}
footer img{height:110px;width:auto;display:block;margin:0 auto 6px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#b42318;color:#fff;padding:12px 20px;border-radius:8px;z-index:50;display:none;max-width:90vw}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding:36px 22px}.hlogo{max-width:240px;order:-1}.logo span{font-size:15px}}
@media print{header,footer,.noprint,#toast{display:none!important}body{background:#fff}.card{box-shadow:none}.ring{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="show('home')"><img data-logo="mark" alt="Visionaries"><span>AI Mock Interviews</span></div>
  <select id="lang" aria-label="Language" onchange="setLang(this.value)">
    <option value="en">English</option><option value="hi">हिन्दी</option><option value="mr">मराठी</option><option value="hn">Hinglish</option>
  </select>
</header>
<main>
<!-- HOME -->
<section id="home" class="screen on">
  <div class="hero"><div><h1 data-i="title"></h1><p data-i="sub"></p><button class="btn" onclick="show('setup')" data-i="start"></button><div class="chips" id="chips"></div></div><img class="hlogo" data-logo="full" alt="Team Visionaries - Dream, Innovate, Build"></div>
  <div class="grid">
    <div class="card feat"><h3 data-i="f1t"></h3><p data-i="f1d"></p></div>
    <div class="card feat"><h3 data-i="f2t"></h3><p data-i="f2d"></p></div>
    <div class="card feat"><h3 data-i="f3t"></h3><p data-i="f3d"></p></div>
    <div class="card feat"><h3 data-i="f4t"></h3><p data-i="f4d"></p></div>
  </div>
</section>
<!-- SETUP -->
<section id="setup" class="screen">
  <div class="card"><h2 style="text-align:center;margin-bottom:14px" data-i="setupT"></h2>
  <div class="form">
    <label><span data-i="field"></span><select id="field"></select></label>
    <input id="fieldOther" style="display:none" data-p="otherPh">
    <label><span data-i="role"></span><input id="role" data-p="rolePh"></label>
    <div><b data-i="mode"></b><div class="seg" id="mode" style="margin-top:6px"><button class="on" data-v="panel" data-i="panel"></button><button data-v="single" data-i="single"></button></div></div>
    <div><b data-i="diff"></b><div class="seg" id="diff" style="margin-top:6px"><button data-v="Easy" data-i="easy"></button><button class="on" data-v="Medium" data-i="medium"></button><button data-v="Hard" data-i="hard"></button></div></div>
    <label><span data-i="resume"></span><textarea id="resume" rows="4" data-p="resumePh"></textarea></label>
    <button class="btn" onclick="begin()" data-i="begin"></button>
  </div></div>
</section>
<!-- INTERVIEW -->
<section id="interview" class="screen">
  <div class="card">
    <div class="top"><span class="tag" id="prog"></span>
      <span><button class="btn sec" id="muteBtn" onclick="toggleMute()" style="padding:6px 14px;font-size:14px"></button>
      <button class="btn red" onclick="finish()" style="padding:6px 14px;font-size:14px" data-i="end"></button></span></div>
    <div class="panel" id="avatars"></div>
    <div id="chat"></div>
    <div class="bar">
      <button class="mic" id="mic" onclick="toggleMic()" title="Mic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <input id="typed" data-p="typePh" onkeydown="if(event.key==='Enter')sendTyped()">
      <button class="btn" onclick="sendTyped()" style="padding:12px 20px" data-i="send"></button>
    </div>
    <p class="note" id="micNote"></p>
  </div>
</section>
<!-- REPORT -->
<section id="report" class="screen">
  <div class="card rep" id="repBox"></div>
</section>
</main>
<footer><img data-logo="full" alt="Team Visionaries"><div>&copy; 2026 Team Visionaries</div></footer>
<div id="toast"></div>

const FIELDS=[['Computer Science','कंप्यूटर साइंस','संगणक शास्त्र'],['Engineering','इंजीनियरिंग','अभियांत्रिकी'],['Commerce & Accounts','कॉमर्स और अकाउंट्स','वाणिज्य व लेखा'],['Nursing & Medical','नर्सिंग और मेडिकल','नर्सिंग व वैद्यकीय'],['Law','कानून','कायदा'],['Arts & Humanities','आर्ट्स','कला'],['Management / MBA','मैनेजमेंट / MBA','व्यवस्थापन / MBA'],['Banking & Govt Exams','बैंकिंग और सरकारी परीक्षा','बँकिंग व सरकारी परीक्षा'],['Teaching','शिक्षण','शिक्षण'],['Science (Physics/Chem/Bio)','विज्ञान','विज्ञान']];
const COL=['#7c3aed','#ec4899','#f97316','#06b6d4','#22c55e','#3b82f6'];
const SR_LANG={en:'en-IN',hi:'hi-IN',mr:'mr-IN',hn:'en-IN'};
const FILL=new Set(['um','umm','uh','uhh','hmm','like','basically','actually','literally','matlab','toh','yaani','मतलब','यानी','तो','म्हणजे','अं','ऐसे','जैसे']);

let lang=localStorage.getItem('aimiLang')||'en';
const t=k=>L[lang][k]||L.en[k]||k;
const S={setup:null,msgs:[],turn:0,max:6,muted:false,answers:[],busy:false,speaker:null};

function setLang(l){
  lang=l;localStorage.setItem('aimiLang',l);$('#lang').value=l;
  document.documentElement.lang=l==='hn'?'en':l;
  $$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $$('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));
  const idx=lang==='hi'?1:lang==='mr'?2:0;
  const cur=$('#field').value;
  $('#field').innerHTML=FIELDS.map(f=>`<option value="${f[0]}">${f[idx]}</option>`).join('')+`<option value="__other">${t('other')}</option>`;
  if(cur)$('#field').value=cur;
  $('#chips').innerHTML=FIELDS.map((f,i)=>`<span class="chip">${f[idx]}</span>`).join('');
  $('#muteBtn').textContent=S.muted?t('unmute'):t('mute');
  $('#micNote').textContent=SR?'':t('noMic');
  updateProg();
  if(!$('#interview').classList.contains('on'))return;
  $$('.av small').forEach(e=>e.textContent=t(e.dataset.k));
}
function show(id){$$('.screen').forEach(s=>s.classList.toggle('on',s.id===id));scrollTo({top:0,behavior:'smooth'});if(id!=='interview'){stopMic();speechSynthesis.cancel()}}
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',5000)}
$('#field').onchange=e=>$('#fieldOther').style.display=e.target.value==='__other'?'block':'none';
$$('.seg').forEach(g=>g.onclick=e=>{if(e.target.tagName!=='BUTTON')return;$$('#'+g.id+' button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on')});
const segVal=id=>$('#'+id+' .on').dataset.v;

/* ---------- API ---------- */
async function api(body){
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({error:'Bad response'}));
  if(!r.ok)throw new Error(j.error||'Error');return j;
}

/* ---------- INTERVIEW ---------- */
function updateProg(){const e=$('#prog');if(e)e.textContent=`${t('q')} ${Math.min(S.turn+1,S.max)} / ${S.max}`}
function begin(){
  const f=$('#field').value==='__other'?$('#fieldOther').value.trim():$('#field').value;
  const role=$('#role').value.trim();
  if(!f||!role){toast(t('needField'));return}
  S.setup={field:f,role,lang,mode:segVal('mode'),difficulty:segVal('diff'),resume:$('#resume').value.trim()};
  S.msgs=[{role:'user',text:'START'}];S.turn=0;S.answers=[];$('#chat').innerHTML='';
  const p=S.setup.mode==='panel';
  $('#avatars').innerHTML=p?`<div class="av" id="av-Priya"><div class="face">P</div><b>Priya</b><small data-k="hr">${t('hr')}</small></div><div class="av r" id="av-Rahul"><div class="face">R</div><b>Rahul</b><small data-k="tech">${t('tech')}</small></div>`:`<div class="av" id="av-Interviewer"><div class="face">I</div><b>${t('intr')}</b></div>`;
  show('interview');updateProg();ask();
}
function bubble(cls,who,text){
  const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=`<b>${who}</b><span></span>`;d.lastChild.textContent=text;
  $('#chat').appendChild(d);$('#chat').scrollTop=1e9;return d;
}
async function ask(){
  S.busy=true;
  const w=bubble('ai','…','');w.lastChild.innerHTML=`<span class="dots"><span></span><span></span><span></span></span> ${t('thinking')}`;
  try{
    const j=await api({action:'interview',setup:S.setup,messages:S.msgs});
    w.remove();
    S.msgs.push({role:'model',text:JSON.stringify({speaker:j.speaker,text:j.text})});
    bubble('ai',j.speaker,j.text);speak(j.text,j.speaker);
  }catch(e){w.remove();toast(t('err')+e.message)}
  S.busy=false;
}
function send(text,secs){
  text=text.trim();if(!text||S.busy)return;
  speechSynthesis.cancel();
  bubble('me',t('you'),text);
  S.msgs.push({role:'user',text});S.answers.push({text,secs:secs||0});S.turn++;updateProg();
  if(S.turn>=S.max)finish();else ask();
}
function sendTyped(){const v=$('#typed').value;$('#typed').value='';send(v,0)}

/* ---------- VOICE ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recText='',recStart=0,listening=false;
function toggleMic(){
  if(!SR){toast(t('noMic'));return}
  if(listening){stopMic(true);return}
  if(S.busy)return;
  speechSynthesis.cancel();
  rec=new SR();rec.lang=SR_LANG[lang];rec.continuous=true;rec.interimResults=true;recText='';recStart=Date.now();
  let fin='';
  rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript+' ';else interim+=r[0].transcript}recText=fin+interim;$('#typed').value=recText};
  rec.onerror=e=>{if(e.error==='not-allowed')toast(t('noMic'));listening=false;$('#mic').classList.remove('live')};
  rec.onend=()=>{if(listening){try{rec.start()}catch{}}};
  rec.start();listening=true;$('#mic').classList.add('live');$('#micNote').textContent=t('listening');
}
function stopMic(sendIt){
  if(!listening&&!rec)return;
  listening=false;$('#mic').classList.remove('live');$('#micNote').textContent=SR?'':t('noMic');
  try{rec.stop()}catch{}
  if(sendIt){const secs=(Date.now()-recStart)/1000;const txt=recText||$('#typed').value;$('#typed').value='';recText='';send(txt,secs)}
  rec=null;
}
function toggleMute(){S.muted=!S.muted;if(S.muted)speechSynthesis.cancel();$('#muteBtn').textContent=S.muted?t('unmute'):t('mute')}
function speak(text,who){
  $$('.av').forEach(a=>a.classList.remove('on'));
  const av=$('#av-'+who);if(av)av.classList.add('on');
  if(S.muted||!window.speechSynthesis){setTimeout(()=>av&&av.classList.remove('on'),1500);return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang=SR_LANG[lang];
  const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith(u.lang.slice(0,2).toLowerCase()));
  const pick=vs.filter(v=>v.lang===u.lang).concat(vs);
  const fem=pick.find(v=>/female|zira|heera|swara|veena|neerja|kalpana|google/i.test(v.name));
  const male=pick.find(v=>/male|ravi|hemant|prabhat|madhur/i.test(v.name)&&!/female/i.test(v.name));
  const v=who==='Rahul'?(male||pick[1]||pick[0]):(fem||pick[0]);
  if(v)u.voice=v;
  u.pitch=who==='Rahul'?.75:who==='Priya'?1.25:1;u.rate=.97;
  u.onend=()=>av&&av.classList.remove('on');
  speechSynthesis.speak(u);
}
speechSynthesis&&(speechSynthesis.onvoiceschanged=()=>{});

/* ---------- REPORT ---------- */
async function finish(){
  if(S.busy&&S.msgs.length<2)return;
  stopMic();speechSynthesis.cancel();
  show('report');$('#repBox').innerHTML=`<h2 style="text-align:center"><span class="dots"><span></span><span></span><span></span></span> ${t('loading')}</h2>`;
  try{
    const {report:r}=await api({action:'report',setup:S.setup,messages:S.msgs});
    renderReport(r);
  }catch(e){$('#repBox').innerHTML=`<p>${t('err')}${esc(e.message)}</p><button class="btn" onclick="show('home')">OK</button>`}
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function speakStats(){
  const voice=S.answers.filter(a=>a.secs>2);
  const all=S.answers.flatMap(a=>a.text.toLowerCase().replace(/[.,!?।]/g,'').split(/\s+/));
  const fillers=all.filter(w=>FILL.has(w)).length;
  const words=voice.reduce((n,a)=>n+a.text.split(/\s+/).length,0),mins=voice.reduce((n,a)=>n+a.secs,0)/60;
  return{fillers,wpm:mins>0?Math.round(words/mins):null};
}
function renderReport(r){
  const ring=(k,c)=>`<div class="score"><div class="ring" style="--c:${c}" data-v="${+r[k]||0}"><i>${+r[k]||0}</i></div>${t(k)}</div>`;
  const sp=speakStats();
  const mis=(r.mistakes||[]).map(m=>`<div class="mis"><b>${esc(m.question)}</b><p><i>${t('yours')}:</i> ${esc(m.yourAnswer)}</p><p>${esc(m.issue)}</p><div class="good"><b>${t('better')}:</b> ${esc(m.betterAnswer)}</div></div>`).join('')||`<p>${t('noMis')}</p>`;
  $('#repBox').innerHTML=`<h2 style="text-align:center;font-size:28px">${t('repT')}</h2><p style="text-align:center">${esc(S.setup.field)} • ${esc(S.setup.role)} • ${S.setup.difficulty}</p>
  <div class="scores">${ring('overall','#1f6feb')}${ring('knowledge','#1f6feb')}${ring('communication','#1f6feb')}${ring('confidence','#1f6feb')}</div>
  <p style="text-align:center">${esc(r.summary)}</p>
  <h2>${t('strengths')}</h2><ul>${(r.strengths||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  <h2>${t('mistakes')}</h2>${mis}
  <h2>${t('next')}</h2><ul>${(r.nextSteps||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  <h2>${t('speaking')}</h2><p>${t('fillers')}: <b>${sp.fillers}</b> &nbsp;|&nbsp; ${t('wpm')}: <b>${sp.wpm??'—'}</b>${sp.wpm?'':' ('+t('na')+')'}</p>
  <div style="display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap" class="noprint"><button class="btn" onclick="print()">${t('print')}</button><button class="btn sec" onclick="show('setup')">${t('again')}</button></div>`;
  setTimeout(()=>$$('.ring').forEach(e=>e.style.setProperty('--v',e.dataset.v)),100);
}
setLang(lang);
</script>
</body>
</html>
